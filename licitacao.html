<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FISAM Tour | Detalhe da Licitação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-nav="licitacoes">
  <div class="workspace">
    <header class="topbar">
      <button class="btn btn--outline nav-toggle" type="button" data-nav-toggle>Menu</button>
      <div class="topbar__title">
        <h1 class="title" id="pageTag">Detalhe da licitação</h1>
        <p class="muted">Linhas operacionais. Os cards usam o razão.</p>
      </div>
      <div class="topbar__actions">
        <button class="btn btn--outline" id="btnAdd">Nova linha</button>
        <button class="btn btn--outline" id="btnSave">Atualizar</button>
      </div>
    </header>
    <div class="alert" id="alert" hidden></div>
    <section class="panel">
      <div class="filters">
        <div class="field">
          <label class="field__label" for="q">Buscar</label>
          <input class="field__input" id="q" type="search" placeholder="Trecho, placa, hóspede" />
        </div>
        <div class="field">
          <label class="field__label" for="filterPago">Pagamento</label>
          <select class="field__input" id="filterPago">
            <option value="all">Todos</option>
            <option value="sim">Pagos</option>
            <option value="nao">Não pagos</option>
          </select>
        </div>
      </div>
      <div class="summary summary--inline" id="totals"></div>
      <div class="table-wrap">
        <table class="table" id="table">
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
          <tfoot id="tfoot"></tfoot>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </section>
    <footer class="footer">
      <div><a class="link" href="./licitacoes.html">← Voltar às licitações</a></div>
    </footer>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" data-close="1"></div>
    <div class="modal__card modal__card--wide" role="dialog" aria-modal="true">
      <div class="modal__head">
        <h3 class="modal__title" id="modalTitle">Editar registro</h3>
        <button class="iconbtn" aria-label="Fechar" data-close="1">✕</button>
      </div>
      <form id="form">
        <div class="grid2" id="formFields"></div>
        <div class="modal__actions">
          <button type="button" class="btn btn--outline" data-close="1">Cancelar</button>
          <button type="submit" class="btn btn--primary">Aplicar</button>
        </div>
      </form>
    </div>
  </div>

  <datalist id="passageirosList"></datalist>

  <script src="./js/shell.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/licitacao.js"></script>
</body>
</html>
