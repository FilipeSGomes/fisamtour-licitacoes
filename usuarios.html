<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FISAM Tour | Usuários</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-nav="usuarios">
  <div class="workspace">
    <header class="topbar">
      <button class="btn btn--outline nav-toggle" type="button" data-nav-toggle>Menu</button>
      <div class="topbar__title">
        <h1 class="title">Usuários</h1>
        <p class="muted">Acesso administrativo. A senha nova precisa de 10 caracteres.</p>
      </div>
    </header>
    <div class="alert" id="alert" hidden></div>
    <section class="panel">
      <form id="form" class="grid2" style="padding:16px">
        <div class="field">
          <label class="field__label" for="nome">Nome</label>
          <input class="field__input" id="nome" required />
        </div>
        <div class="field">
          <label class="field__label" for="email">E-mail</label>
          <input class="field__input" id="email" type="email" required />
        </div>
        <div class="field">
          <label class="field__label" for="password">Senha</label>
          <input class="field__input" id="password" type="password" autocomplete="new-password" minlength="10" />
        </div>
        <div class="field">
          <label class="field__label" for="status">Status</label>
          <select class="field__input" id="status">
            <option value="ativo">Ativo</option>
            <option value="inativo">Inativo</option>
          </select>
        </div>
        <div class="modal__actions">
          <button class="btn btn--primary" type="submit">Salvar usuário</button>
        </div>
      </form>
      <div class="filters">
        <div class="field">
          <label class="field__label" for="q">Buscar</label>
          <input class="field__input" id="q" type="search" placeholder="Nome ou e-mail" />
        </div>
        <div class="field">
          <label class="field__label" for="filtroStatus">Status</label>
          <select class="field__input" id="filtroStatus">
            <option value="all">Todos</option>
            <option value="ativo">Ativo</option>
            <option value="inativo">Inativo</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Nome</th><th>E-mail</th><th>Status</th><th></th></tr></thead>
          <tbody id="tbody"><tr><td colspan="4" class="empty">Carregando…</td></tr></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </section>
  </div>
  <script src="./js/shell.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/usuarios.js"></script>
</body>
</html>
