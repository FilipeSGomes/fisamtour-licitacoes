<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FISAM Tour | Usuários</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <div class="brand">
        <img src="./logo.png" alt="FISAM Tour" class="brand__logo" />
        <div class="brand__text">
          <div class="brand__name">FISAM TOUR</div>
          <div class="brand__tag">Usuários</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav__link" href="./index.html">Dashboard</a>
        <a class="nav__link" href="./licitacoes.html">Licitações</a>
        <a class="nav__link" href="./passageiros.html">Passageiros</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <div class="alert" id="alert" hidden></div>
    <section class="panel">
      <form id="form" class="grid2" style="padding:16px">
        <div class="field">
          <label class="field__label" for="nome">Nome</label>
          <input class="field__input" id="nome" required />
        </div>
        <div class="field">
          <label class="field__label" for="email">E-mail</label>
          <input class="field__input" id="email" type="email" required />
        </div>
        <div class="field">
          <label class="field__label" for="password">Senha</label>
          <input class="field__input" id="password" type="password" autocomplete="new-password" />
        </div>
        <div class="field">
          <label class="field__label" for="status">Status</label>
          <select class="field__input" id="status">
            <option value="ativo">Ativo</option>
            <option value="inativo">Inativo</option>
          </select>
        </div>
        <div class="modal__actions">
          <button class="btn btn--primary" type="submit">Salvar usuário</button>
        </div>
      </form>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Nome</th><th>E-mail</th><th>Status</th><th></th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="./js/api.js"></script>
  <script src="./js/usuarios.js"></script>
</body>
</html>
