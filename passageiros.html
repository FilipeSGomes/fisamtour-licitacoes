<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FISAM Tour | Passageiros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-nav="passageiros">
  <div class="workspace">
    <header class="topbar">
      <button class="btn btn--outline nav-toggle" type="button" data-nav-toggle>Menu</button>
      <div class="topbar__title">
        <h1 class="title">Passageiros</h1>
        <p class="muted">A pessoa é cadastrada uma vez e referenciada na linha operacional</p>
      </div>
    </header>
    <div class="alert" id="alert" hidden></div>
    <section class="panel">
      <form id="form" class="grid2" style="padding:16px">
        <div class="field">
          <label class="field__label" for="nome">Nome</label>
          <input class="field__input" id="nome" required />
        </div>
        <div class="field">
          <label class="field__label" for="data_nasc">Data de nascimento</label>
          <input class="field__input" id="data_nasc" type="date" />
        </div>
        <div class="field">
          <label class="field__label" for="cpf">CPF</label>
          <input class="field__input" id="cpf" inputmode="numeric" autocomplete="off" />
        </div>
        <div class="modal__actions">
          <button class="btn btn--primary" type="submit" id="btnSave">Salvar passageiro</button>
        </div>
      </form>
      <div class="panel__row panel__row--simple">
        <div class="field">
          <label class="field__label">Buscar nome</label>
          <input class="field__input" type="search" id="q" placeholder="Nome do passageiro" />
        </div>
      </div>
      <div class="panel__head">
        <h1 class="title">Passageiros</h1>
        <div class="muted" id="count">0 itens</div>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr><th>Nome</th><th>Data nasc.</th><th>CPF</th><th></th></tr>
          </thead>
          <tbody id="tbody"><tr><td colspan="4" class="empty">Carregando…</td></tr></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </section>
  </div>

  <script src="./js/shell.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/passageiros.js"></script>
</body>
</html>
